<div class="mb-4">
    {% for candidate in candidates %}
        {% include "rooms/candidate_card.html" with candidate=candidate favourite=favourite %}       
    {% empty %}
        <div class="alert alert-primary" role="alert">
            {{ message }}
        </div>
    {% endfor %}
</div>

{% if candidates.all.count != 0 and room.host == request.user and room.status == "open" %}
    <hr  class="mb-4">
    <div class="text-end mb-4">
        <button type="button" id="close-room-btn" class="btn btn-primary">Cerrar y elegir</button>
    </div>
{% endif %}

<div class="modal fade" id="closeRoomModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
        <div class="modal-header">
            <h1 class="modal-title fs-5 text-primary" id="closeRoomModalToggleLabel">Elegir y cerrar sala</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">

        <select class="form-select" id="candidate-select">
            <option value="" disabled selected>Selecciona un candidato</option>
            {% for candidate in candidates %}
                <option value="{{ candidate.id }}">{{ candidate.title }}</option>
            {% endfor %}
        </select>
    
      </div>
      <div class="modal-footer d-flex justify-content-center align-items-center">
        <button id="confirm-close-room-btn" type="button" class="btn btn-primary">Aceptar</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </div>
  </div>
</div>
