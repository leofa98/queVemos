{% extends "base.html" %}

{% load static %}

{% block extra_js %}
    <script defer src="{% static 'rooms/rooms.js' %}"></script>
{% endblock %}

{% block title %}Salas{% endblock %}

{% block body %}

<div class="room-list d-flex flex-column flex-grow-1" >
    <div class="d-flex justify-content-between mb-4">
        <h2 class="my-2 text-primary">Mis salas</h2>
        <button id="create-room-btn" type="button" class="btn btn-primary align-self-center" data-bs-toggle="modal" data-bs-target="#create-room-modal"><i class="bi bi-plus-circle  me-2"></i> Crear sala</button>
    </div>
    <div class="mb-4">
        <div class="d-flex justify-content-between justify-content-md-start align-items-center p-4 gap-4 rounded-3 border border-dashed bg-light border-secondary-subtle border-2">
            <p class="text-secondary mb-0 text-wrap" for="invitation-code">Unirse con código:</p>
            <input  class="font-monospace text-uppercase text-center form-control form-control-lg" type="text" maxlength="6"  autocomplete="off" name="invitation-code" id="invitation-code">
            <button type="" id="btn-join-room" class="btn btn-outline-primary">Unirse</button>
        </div>
    </div>
    <div class="d-flex gap-3 flex-wrap mb-4">
        <a class="btn btn-outline-primary status-chip active" data-status="">
            Todas
        </a>
        <a class="btn btn-outline-primary status-chip"  data-status="open">
            Abiertas
        </a>
        <a class="btn btn-outline-primary status-chip" data-status="closed">
            Cerradas
        </a>
    </div>
    <div id="room-list" class="mb-5">
        {% include "rooms/room_list.html" with page_obj=page_obj message=message %} 
    </div>
    <div id="spinner" class="d-flex flex-column flex-grow-1 justify-content-center align-items-center mb-5 d-none">
        <div class="spinner-grow text-primary" role="status">
        </div>
    </div>
</div>

<div class="modal fade" id="create-room-modal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-room mb-0 fs-5 text-primary" id="add-room-modal-label">Añadir sala</h1>
                <button type="button" class="btn-close text-light" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-4">
                    
                    <label for="room-name" class="form-label text-secondary">NOMBRE DE LA SALA</label>
                    <input class="form-control" type="text" name="room-name" id="room-name">
                </div>
                <div class="mb-3">
                   <div class="form-check m-0">
                        <input class="form-check-input" type="checkbox" value="True" id="allow-seen" name="allow-seen">
                        <label class="form-check-label text text-secondary" for="allow-seen">
                            Incluir en las sugerencias títulos que alguno ya haya visto
                        </label>
                    </div>
                </div>
        
            </div>
            <div class="modal-footer d-flex justify-content-center align-items-center">
                <input id="create-room-modal-btn" type="submit" class="btn btn-primary" value="Crear"/>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}
