
<div data-room-id="{{ room.id }}" class="mx-0 room-card row border border-secondary p-4 mb-3 rounded-2 align-items-center">
    <div class="col">
        <div class="d-flex gap-3 align-items-center mb-3">
            <h5 class="text-primary m-0">
                <b>{{ room.name }}</b>
            </h5>
            <div class="d-inline-flex px-2 py-1 fw-semibold text-warning-emphasis bg-warning-subtle border border-warning-subtle rounded-2">
                <small>
                    Anfitrión
                </small> 
            </div>
        </div>
        {% if winner %}
         
        {% else %}
           <p class="text-secondary m-0"><small class="text-secodary">{% if room.memberships.count > 1 %} {{ room.memberships.count }} Miembro(s) {% else %} Sólo tú {% endif %}  · {% if room.candidates.count %} {{ room.candidates.count }} Candidato(s){% else %} Sin candidatos todavía{% endif %}</small></p>
        {% endif %}
    </div>
    <div class="col text-end justify-content-end align-content-center d-flex gap-2">
        <a data-room-id="{{ room.id }}" type="button" class="btn btn-primary room-card-edit">
            Ir
        </a>
    </div>
</div>
