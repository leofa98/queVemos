<div data-candidate-id="{{ candidate.id }}"  {% if candidate.id == favourite.id %}data-leader{% endif %} class="{% if candidate.room.status == "closed" and candidate.room.winner.id != candidate.id %} bg-secondary-subtle {% endif %} mx-0 entry-card d-md-flex justify-content-between align-items-center border border-secondary p-3 p-sm-4 mb-3 rounded-2 align-items-center">
    
    <div>
        <div class="d-flex justify-content-start align-items-md-center gap-1 gap-md-3 flex-column flex-md-row mb-3">
            <h5 class="m-0 {% if candidate.room.status == "closed" and candidate.room.winner.id != candidate.id %} text-secondary {% else %} text-primary {% endif %} ">
                <b>{{ candidate.title.name }}</b>
            </h5>
            <small class="text-secondary">
                {{ candidate.title.get_media_type_display }} · {{ candidate.title.year }}
                {% if candidate.room.winner.id == candidate.id %}
                    <span class="ms-2 badge text-white bg-success mt-1 mt-md-0">Ganador</span> 
                {% elif candidate.id == favourite.id %}
                    <span class="ms-2 badge text-danger-emphasis bg-danger-subtle mt-1 mt-md-0">Favorito</span>
                {% endif %}
            </small>
        </div>
        <div class="mb-3">
              <small class="text-primary fw-bold">
                {{ candidate.get_origin_display }}
            </small> · <small class="m-0 text-secondary">{{ candidate.reason }}</small>
        </div>

    </div>
    <div class="d-flex w-50 justify-content-end align-items-end flex-column mb-3 mb-md-0">
        <div class=" d-none d-md-flex gap-1">
            <button data-vote-position="up"  data-candidate-id="{{ candidate.id }}" {% if room.status == "closed" %} disabled {% endif %} class="btn btn-sm vote-btn {% if candidate.voted_up %} btn-success {% else %} btn-outline-success {% endif %}" type="button">
                <i class="bi bi-hand-thumbs-up"></i>
                {{ candidate.up_count }}
            </button>
            <button data-vote-position="down" data-candidate-id="{{ candidate.id }}"  {% if room.status == "closed" %} disabled {% endif %} class="btn btn-sm vote-btn {% if candidate.voted_down %} btn-danger {% else %} btn-outline-danger {% endif %}"  type="button">
                <i class="bi bi-hand-thumbs-down"></i>
                {{ candidate.down_count }}
            </button> 
        </div>
    </div>

    <div class="d-flex gap-1 d-md-none w-100">
        <div class="col">
            <button data-vote-position="up"  data-candidate-id="{{ candidate.id }}" {% if room.status == "closed" %} disabled {% endif %} class="btn vote-btn w-100 {% if candidate.voted_up %} btn-success {% else %} btn-outline-success {% endif %}" type="button">
                <i class="bi bi-hand-thumbs-up"></i>
                {{ candidate.up_count }}
            </button>
        </div>
        <div class="col">
            <button data-vote-position="down" data-candidate-id="{{ candidate.id }}"  {% if room.status == "closed" %} disabled {% endif %} class="btn vote-btn w-100 {% if candidate.voted_down %} btn-danger {% else %} btn-outline-danger {% endif %}"  type="button">
                <i class="bi bi-hand-thumbs-down"></i>
                {{ candidate.down_count }}
            </button> 
        </div>

    </div>

</div>
