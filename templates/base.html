{% load static %}

<!DOCTYPE html>
<html lang="es" class="min-vh-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuéVemos | {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static "css/main.css" %}">
</head>
<body class="d-flex flex-column min-vh-100 ">
    <header>
        <nav class="navbar navbar-expand-md bg-primary" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="logo" href="{% url 'index' %}">Qu<span>é</span>Vemos</a>
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-md-end mt-3 mt-md-0" id="navbarNavAltMarkup">
                    <ul class="gap-2 navbar-nav">

                        {% if user.is_authenticated %}
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    {{ user.username }}
                                </a>
                                <ul class="dropdown-menu dropdown-menu-lg-end bg-body-secondary">
                                    <li><a class="dropdown-item" href="#">Mi perfil</a></li>
                                    <li><a class="dropdown-item" href={% url 'logout' %}>Cerrar sesión</a></li>
                                </ul>
                            </li>
                        {% else %}
                            <a class="btn btn-sm  btn-outline-light" href={% url 'login' %}>Entrar</a>
                            <a class="btn btn-sm btn-outline-light" href={% url 'register' %}>Crear cuenta</a>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="body m-3 m-md-4 d-flex flex-column flex-grow-1">
        {% block body %}{% endblock %}
    </main>
</body>
</html>
