{% load static %}

<!DOCTYPE html>
<html lang="es" class="min-vh-100">
    <head>
        <meta charset="UTF-8">
        <meta name="csrf-token" content="{{ csrf_token }}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>QuéVemos | {% block title %}{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="{% static "css/main.css" %}">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script defer src="{% static 'js/common.js' %}"></script>
        {% block extra_js %}{% endblock %}
    </head>
    <body class="d-flex flex-column min-vh-100 ">
        <header class="sticky-top">
            <nav class="navbar navbar-expand-md bg-primary align-content-center" data-bs-theme="dark">
                <div class="container py-1">
                    <a class="logo" href="{% url 'index' %}">Qu<span>é</span>Vemos</a>
                    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse justify-content-md-end" id="navbarNavAltMarkup">
                        <div class="navbar-nav w-100">

                            {% if user.is_authenticated %}
                                <div class="d-md-flex justify-content-md-start align-self-center w-100 ps-md-4">
                                    <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"  href={% url 'dashboard' %}>Biblioteca</a>
                                    <a class="nav-link {% if request.resolver_match.url_name == 'rooms' %}active{% endif %}"  href={% url 'rooms' %}>Salas</a>                   
                                </div>
                
                                <div class="nav-item dropdown" data-bs-theme="light">
                               
                                    <a class="nav-link dropdown-toggle py-2" href="#" role="button" data-bs-toggle="dropdown">
                                        <i class="bi bi-person-circle me-1"></i> {{ user.username }}
                                    </a>
                                    <ul class="dropdown-menu dropdown-menu-lg-end bg-body-secondary">
                                        <li><a class="dropdown-item" href="#">Mi perfil</a></li>
                                        <li><a class="dropdown-item" href={% url 'logout' %}>Cerrar sesión</a></li>
                                    </ul>
                                
                                </div>
                            {% else %}

                                <div class="d-flex justify-content-end mt-4 mt-md-0 flex-column flex-md-row align-self-center w-100 gap-2">
                                    <a class="btn btn-sm  btn-outline-light" href={% url 'login' %}>Entrar</a>
                                    <a class="btn btn-sm btn-outline-light" href={% url 'register' %}>Crear cuenta</a>
                                </div>

                            {% endif %}
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <main class="body {% block main_class %} container mt-4  {% endblock %} d-flex flex-column flex-grow-1">
            {% block body %}{% endblock %}
            <div class="toast-container position-fixed top-0 end-0 p-3">
                <div id="toast-success" class="toast align-items-center text-bg-success border-0" role="alert">
                    <div class="d-flex">
                        <div class="toast-body" id="toast-success-msg"></div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
                <div id="toast-danger" class="toast align-items-center text-bg-danger border-0" role="alert">
             
                    <div class="d-flex">
                        <div class="toast-body" id="toast-danger-msg"></div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
