{% if page_obj.paginator.num_pages > 1 %}
    <div class="d-flex align-items-center justify-content-center">
        <nav>
            <ul class="pagination">
                {% if page_obj.has_previous %}
                    <li class="page-item">
                        <a class="page-link" href="?status={{ request.GET.status }}&query={{ request.GET.query }}&page={{ page_obj.previous_page_number }}">
                            <span><i class="bi bi-arrow-left"></i></span>
                        </a>
                    </li>
                    <li class="page-item"><a class="page-link" href="?status={{ request.GET.status }}&query={{ request.GET.query }}&page={{ page_obj.previous_page_number }}">{{ page_obj.previous_page_number }}</a></li>
                {% endif %}
                <li class="page-item active"><a class="page-link" href="?status={{ request.GET.status }}&query={{ request.GET.query }}&page={{ page_obj.number }}">{{ page_obj.number }}</a></li>
                {% if page_obj.has_next %}
                    <li class="page-item"><a class="page-link" href="?status={{ request.GET.status }}&query={{ request.GET.query }}&page={{ page_obj.next_page_number }}">{{ page_obj.next_page_number }}</a></li>
                    <li class="page-item">
                        <a class="page-link" href="?status={{ request.GET.status }}&query={{ request.GET.query }}&page={{ page_obj.next_page_number }}">
                            <span><i class="bi bi-arrow-right"></i></span> 
                        </a>
                    </li>
                {% endif %}
            </ul>
        </nav>
    </div>
{% endif %}
